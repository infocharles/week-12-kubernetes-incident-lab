apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: w12-charles-notifications
    cloudpros.io/lab: week-12
    cloudpros.io/student: charles
  name: w12-charles-notifications
  namespace: dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: w12-charles-notifications
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: w12-charles-notifications
        cloudpros.io/lab: week-12
        cloudpros.io/student: charles
    spec:
      containers:
      - image: public.ecr.aws/docker/library/nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: notifications
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: 25m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30