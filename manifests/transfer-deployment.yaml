apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: w12-charles-transfer
    cloudpros.io/lab: week-12
    cloudpros.io/student: charles
  name: w12-charles-transfer
  namespace: dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: w12-charles-transfer
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: w12-charles-transfer
        cloudpros.io/lab: week-12
        cloudpros.io/student: charles
    spec:
      containers:
      - image: public.ecr.aws/docker/library/nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        name: transfer
        resources:
          limits:
            cpu: 25m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
